name: ASC Register App ID

# App Store Connect API で App ID(me.noshi.app) を登録し Sign in with Apple capability を
# 有効化する（#210/#204）。UI ログイン不要で実施できる Apple 側作業の自動化。
# workflow_dispatch のため、手動で必要な時だけ実行する。冪等（再実行安全）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    name: register bundle id + capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install "pyjwt[crypto]==2.10.1"
      - name: register App ID + Sign in with Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: python scripts/asc/register_appid.py
