# App Store Connect のメタデータ入力（#210/#211/#199/#201/#212）。
# fastlane deliver で 説明文/スクショ/カテゴリ/年齢レーティング/レビュー情報/App Privacy を反映する。
# バイナリの TestFlight 配信は ios-release.yml（別ワークフロー）。
name: ASC Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned fastlane
        working-directory: fastlane
        run: bundle install

      - name: Upload metadata to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_DEMO_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
          ASC_CONTACT_FIRST_NAME: ${{ secrets.ASC_CONTACT_FIRST_NAME }}
          ASC_CONTACT_LAST_NAME: ${{ secrets.ASC_CONTACT_LAST_NAME }}
          ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
          ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          BUNDLE_GEMFILE: fastlane/Gemfile
        run: bundle exec fastlane ios asc_metadata
