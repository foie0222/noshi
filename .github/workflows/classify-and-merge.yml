name: Classify and Merge

# CI ワークフローの完了をトリガに、対象 PR を分類する。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    name: classify and (maybe) auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: 対象 PR を特定
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          num=$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number')
          [ -n "$num" ] || { echo "対象 PR 無し"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: 分類してラベル付与
        id: classify
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          files=$(gh pr view "$PR" --json files -q '.files[].path')
          added=$(gh pr view "$PR" --json additions -q '.additions')
          labels=$(gh pr view "$PR" --json labels -q '.labels[].name')
          verdict=$(FILES="$files" ADDED="$added" LABELS="$labels" python - <<'PY'
          import os
          from scripts.operator.classify_merge import classify
          files = [f for f in os.environ["FILES"].splitlines() if f]
          labels = [x for x in os.environ["LABELS"].splitlines() if x]
          d = classify(files, int(os.environ["ADDED"] or 0), labels)
          print(f"{d.verdict}\t{d.reason}")
          PY
          )
          v=$(printf '%s' "$verdict" | cut -f1); reason=$(printf '%s' "$verdict" | cut -f2-)
          if [ "$v" = "auto" ]; then
            gh pr edit "$PR" --add-label merge:auto --remove-label merge:human
            # 自動マージ対象は operator(GitHub App) が implement.yml 経由で開いた PR のみ。
            # 判定は PR の作者の「完全一致」で行う（部分一致は evil-...noshi-operator-foie0222 等の
            # 偽アカウントを許してしまうため不可）。agent:pr-open ラベルは Issue に付き PR には付かない。
            # gh の GraphQL author.login は App だと "app/<slug>" を返す。REST 由来の "<slug>[bot]" も防御的に許可。
            # 人間発行の低リスク PR は PO がマージ。レビュー指摘があれば未解決スレッドで自動マージは保留される。
            author=$(gh pr view "$PR" --json author -q '.author.login')
            if [ "$author" = "app/noshi-operator-foie0222" ] || [ "$author" = "noshi-operator-foie0222[bot]" ]; then
              gh pr comment "$PR" --body "merge:auto と判定（$reason）。operator PR のため CI緑+レビュー解決で自動マージします。"
              echo "merge=true" >> "$GITHUB_OUTPUT"
            else
              gh pr comment "$PR" --body "merge:auto と判定（$reason）。人間発行 PR のため自動マージはスキップ（PO がマージしてください）。"
              echo "merge=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gh pr edit "$PR" --add-label merge:human --remove-label merge:auto
            gh pr comment "$PR" --body "merge:human と判定（$reason）。PO のマージが必要です。"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      # マージするときだけ、その直前に App トークンを発行する（最小権限。人間発行 PR や
      # merge:human では発行しない）。マージを App で行う理由: GITHUB_TOKEN で行った push は
      # ワークフローを起動しないため、自動マージしても ci.yml のデプロイが走らず、6 月から
      # 本番に出ていなかった（#491）。App の push は起動する（#485 と同じパターン）。
      # ルールセット main は bypass_actors が空なので、App でも必須チェックとスレッド解決は効く。
      - name: GitHub App トークンを発行（マージ push で deploy を発火させる）
        if: steps.classify.outputs.merge == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_APP_PRIVATE_KEY }}

      - name: 自動マージ（App 名義・squash・head ブランチ削除）
        if: steps.classify.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        # --delete-branch: 週次カタログの枝（catalog/refresh-<日付>）が溜まらないように
        run: gh pr merge "$PR" --squash --auto --delete-branch
