name: Catalog Build

# お返し品カタログ（backend/app/catalog/data/items.json）を週次で作り直し、
# 差分があれば PR にする。#468 の設計。
#
# AWS 側には何も置かない。楽天の検索APIは無料で、足切りもスコアも純粋関数なので、
# 費用は Actions の実行時間だけ。実行時（Lambda）はこの JSON を読むだけで、
# ネットワークも LLM も使わない。
#
# PR にする理由は、今週どの商品が入れ替わったかを diff で人間が見られるようにするため。
# 変な品が混じったらマージしなければ本番に出ない。
#
# 注意: GITHUB_TOKEN で作った PR には CI が走らない（GitHub の再帰実行防止）。
# そのぶんの検証はこのワークフロー内で済ませる（下の「生成物を検証」ステップ）。
# CI を走らせたい場合は、PR 作成用の fine-grained PAT を CATALOG_PR_TOKEN に入れる。

on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-build
  cancel-in-progress: false

jobs:
  build:
    name: catalog (rakuten -> items.json)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 84バケツ × 1req/秒 ≒ 2分。余裕を見てもこの範囲
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: items.json を生成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          # 楽天アプリ登録の Allowed websites と一致させる（無いと 403）
          NOSHI_RAKUTEN_SITE: https://noshi.me
        run: python -m tools.catalog.build

      # GITHUB_TOKEN 製の PR には CI が走らないので、ここで代わりに検証する。
      - name: 生成物を検証
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from app.catalog.buckets import all_buckets
          from app.catalog.products import ProductCatalog

          path = Path("app/catalog/data/items.json")
          if not path.exists():
              sys.exit("items.json が生成されていません")
          cat = ProductCatalog(path)
          # 読み込み時の検証（アフィリエイトURL・画像ドメイン）を通った件数で数える
          total = sum(len(cat.for_bucket(t, c, b)) for t, c, b in all_buckets())
          filled = sum(1 for t, c, b in all_buckets() if cat.for_bucket(t, c, b))
          print(f"{filled} バケツ / {total} 商品（生成日 {cat.generated_at}）")
          if total == 0:
              sys.exit("有効な商品が0件です。生成が失敗している可能性があります")
          # 半分以上のバケツが空なら、検索条件か認証が壊れている
          if filled < len(all_buckets()) // 2:
              sys.exit(f"埋まったバケツが少なすぎます（{filled}/{len(all_buckets())}）")
          PY

      - name: ruff / pytest
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q

      - name: 差分があれば PR にする
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PR_TOKEN || secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          # 先に add してから --cached で見る。git diff は未追跡ファイルを差分と見なさないので、
          # items.json がまだ無い初回は「差分なし」と誤判定されて PR が作られなかった（#475）。
          git add backend/app/catalog/data/items.json
          if git diff --cached --quiet -- backend/app/catalog/data/items.json; then
            echo "差分なし。PR は作らない。"
            exit 0
          fi
          branch="catalog/refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(catalog): お返し品カタログを更新する"
          git push -u origin "$branch"
          {
            echo "週次のカタログ更新（自動生成）。Refs #468"
            echo
            echo "楽天の検索API（無料）から取り直した結果です。足切り（レビュー20件以上・"
            echo "★4.0以上・在庫あり・用途別NGワード）とスコア（ベイズ平均・トレンド・"
            echo "セール・ギフト加点）はすべて純粋関数で、LLM は使っていません。"
            echo
            echo "**この diff で今週入れ替わった商品が見えます。** 用途に合わない品が"
            echo "混じっていたらマージしないでください。マージしなければ本番には出ません。"
            echo
            echo "実売価格とセール表記は保存していません（楽天の24時間ルールを避けるため）。"
            echo
            echo "生成物の検証（アフィリエイトURL・画像ドメイン・埋まったバケツ数）と"
            echo "ruff / mypy / pytest はこのワークフロー内で実行済みです。GITHUB_TOKEN で"
            echo "作った PR には CI が走らないため、その代替です。"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/catalog-pr-body.md
          gh pr create \
            --title "chore(catalog): お返し品カタログを更新する" \
            --body-file /tmp/catalog-pr-body.md \
            --base main \
            --label "merge:human"
