# 廃止した旧カタログバッチ（NoshiCatalogBatchStack）を削除する一回きりのワークフロー。
#
# 手順:
#   1. 本 PR を main にマージする（CI が NoshiApiStack / NoshiMonitoringStack を更新し、
#      旧スタックへの Export 参照が外れる。同時にバッチのスケジュールも無効化される）
#   2. Actions からこのワークフローを手動実行する（confirm に「destroy」と入力）
#   3. 完了後、catalog-batch-stack.ts・bin/noshi.ts の生成・CI のデプロイ対象・
#      DataStack のカタログテーブル、そしてこのワークフローを削除する PR を出す
#
# 手順1 より前に実行すると NoshiMonitoringStack が Export を import しているため失敗する。
# デプロイロールの信頼ポリシーは main 限定なので、必ず main ブランチから実行すること。
name: destroy catalog batch (one-shot)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'NoshiCatalogBatchStack を削除します。"destroy" と入力してください'
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: destroy NoshiCatalogBatchStack
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: install CDK deps
        working-directory: infra/cdk
        run: npm ci
      - name: cdk destroy
        working-directory: infra/cdk
        run: npx cdk destroy NoshiCatalogBatchStack --force
