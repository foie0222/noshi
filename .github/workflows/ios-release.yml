name: iOS Release (TestFlight)

# 署名つきアーカイブを作って TestFlight に配信する（#196）。
# 署名は App Store Connect API キー(.p8)による「自動署名」で行う（証明書/プロビジョニングの
# 手動管理・fastlane match は不要）。物理 Mac 不要・GitHub Actions の macOS runner で完結。
#
# 前提（揃うまで成功しない。揃うまでは手動トリガー時のみ実行され、PR は汚さない）:
#   1. #193 がマージ済み（frontend に Capacitor 一式があること）
#   2. App ID `me.noshi.app` を登録し、App Store Connect にアプリレコード作成済み（#210）
#   3. 下記 Secrets を設定済み（docs/ios/testflight-setup.md 参照）
#        ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8, APPLE_TEAM_ID
#
# 実行契機: 手動（workflow_dispatch）または ios-v* タグの push。

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "マーケティングバージョン（例: 1.2）。App Store で公開中のバージョンより高い値が必須。未指定だと Xcode プロジェクトの既定 1.0 のままで、公開後は必ず検証エラーになる（#495）。公開中の値は https://itunes.apple.com/lookup?bundleId=me.noshi.app&country=jp で確認できる"
        required: false
        type: string
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: select latest Xcode (App Store は iOS 26 SDK / Xcode 26+ を要求)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "installed Xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null
          echo "selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: revoke stale cloud-signing certs (証明書上限の回避 #206)
        # クラウド署名が毎ビルド作る使い捨て開発証明書を失効し、Apple の証明書上限到達を防ぐ。
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 ../scripts/revoke-stale-ios-certs.py

      - name: install deps & build web
        # 本番の API/Cognito 設定を注入（未注入だと認証無効・API先が空になる）。値は公開設定（GitHub Variables）。
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_AWS_REGION: ap-northeast-1
        run: |
          npm ci
          npm run build

      - name: add iOS platform & sync (SPM)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: configure Info.plist (URLスキーム #204 / 輸出コンプラ #213)
        run: bash ../scripts/ios-configure-plist.sh ios/App/App/Info.plist

      - name: configure entitlements (Sign in with Apple #198)
        run: bash ../scripts/ios-configure-entitlements.sh ios/App/App/App.entitlements

      - name: generate app icon & splash (#206)
        # frontend/assets/ の icon-only.png / splash*.png から iOS のアイコン・スプラッシュを生成。
        run: npx capacitor-assets generate --ios

      - name: write ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: set build number (CI run number)
        # 自由入力の marketing_version は run 内でテンプレート展開せず env 経由で渡す
        # （スクリプトインジェクション対策。展開すると任意コマンドがシェルに渡り得る）。
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          cd ios/App
          # TestFlight はビルド番号の重複を許さないため CI 連番を使う。
          xcrun agvtool new-version -all "${{ github.run_number }}"
          # ASC の新バージョン（例: 1.1）へ提出するビルドは CFBundleShortVersionString の一致が必要（#417）。
          if [ -n "$MARKETING_VERSION" ]; then
            xcrun agvtool new-marketing-version "$MARKETING_VERSION"
          fi

      - name: archive (auto-sign via ASC API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_ENTITLEMENTS="App/App.entitlements" \
            archive

      - name: export ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "uploading: $IPA"
          # altool は検証エラー（例: CFBundleShortVersionString が承認済みより低い、train が閉鎖）でも
          # 終了コード 0 を返し、bash -e では落ちない（#493: build 24・25 が緑のまま未配信だった）。
          # 出力を JSON で受け、失敗はキー（product-errors）と実出力で確認済みの失敗文言で判定する。
          # 成功文言は Xcode/altool の版や言語で変わり得るので、無くても落とさず警告に留める
          # （正常なリリースを誤って止めない）。このワークフローは shell 未指定＝ bash -e {0} で
          # pipefail が無いため、altool の終了コードは PIPESTATUS で取る。
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios --output-format json \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] \
             || grep -qE '"product-errors"|Failed to upload|Validation failed|ERROR ITMS' "$RUNNER_TEMP/altool.log"; then
            echo "::error::TestFlight へのアップロードに失敗しました（altool rc=$rc）。上の出力を確認してください。"
            exit 1
          fi
          if ! grep -qE '"success-message"|UPLOAD SUCCEEDED|No errors uploading' "$RUNNER_TEMP/altool.log"; then
            echo "::warning::altool の出力に成功の印がありません。App Store Connect でビルドの到着を確認してください。"
          fi

      - name: cleanup secrets
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_"*.p8
